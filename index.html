<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOHTARF – Internet Search Processes | عمليات البحث على الإنترنت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;font-size:22px;background:linear-gradient(135deg,#e3eeff,#fff3d9);min-height:100vh;color:#14264f}
#bg span{position:fixed;bottom:-80px;border-radius:50%;opacity:.3;animation:up linear infinite;z-index:0}@keyframes up{to{transform:translateY(-120vh)}}
.wrap{max-width:900px;margin:auto;padding:12px;position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:8px 16px;box-shadow:0 4px 14px #0002}header img{height:80px}header small{color:#666;font-size:15px}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 14px #0002;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(20px)}}
.en{direction:ltr;text-align:left;font-weight:bold;font-size:25px;margin:6px 0}.ar{direction:rtl;text-align:right;color:#8a3300;font-size:25px;margin:6px 0}
.pt{border-right:8px solid #ffb84d;border-left:8px solid #1f3f9a;padding:8px 14px;margin:14px 0;background:#f4f8ff;border-radius:14px;animation:in .6s both}
h1,h2{margin:6px 0;color:#1f3f9a}.g{color:#1a9c50}.r{color:#d33}
button{font:inherit;font-weight:bold;border:0;border-radius:16px;padding:14px 26px;background:#1f3f9a;color:#fff;cursor:pointer;margin:6px;box-shadow:0 4px 0 #0d2060}button:active{transform:translateY(3px)}
.opt{display:block;width:100%;background:#fff;color:#14264f;border:3px solid #9bb4f0;box-shadow:none;line-height:1.5}.opt:disabled{cursor:default}
.ok{background:#2ecc71!important;color:#fff!important;border-color:#1a9c50!important;animation:pop .6s}.bad{background:#e74c3c!important;color:#fff!important;animation:shk .5s}
@keyframes pop{50%{transform:scale(1.06)}}@keyframes shk{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.bar{height:14px;background:#dde5f7;border-radius:8px;margin-bottom:8px}.bar i{display:block;height:100%;background:#ffb84d;border-radius:8px;transition:.4s}
.fx{position:fixed;font-size:44px;pointer-events:none;z-index:9;animation:fly 1.3s forwards}@keyframes fly{to{transform:translateY(-300px) rotate(360deg);opacity:0}}
input{font:inherit;width:100%;padding:14px;border:3px solid #1f3f9a;border-radius:14px;text-align:center;margin:10px 0}
.wa{background:#25a244;box-shadow:0 4px 0 #166b2d}.o2{background:#ff9f1c;box-shadow:0 4px 0 #b36b00}.c{text-align:center}
</style></head><body><div id="bg"></div><div id="app"></div>

T('المتصفحات الآمنة تعطي تنبيهًا عند زيارة موقع غير آمن.','Safe browsers give a warning when you visit an unsafe site.',1,1,'a');

T('يمكن البحث باستخدام صورة بدلًا من الكلمات.','You can search using an image instead of words.',1,2,'a');
T('المتصفحات الآمنة هي التي ترسل تنبيهات إلى المستخدمين عند محاولة الدخول إلى موقع إلكتروني غير آمن.','Safe browsers are the ones that send alerts to users when they try to enter an unsafe website.',1,1,'a');

M('يُستخدم الرمز ...... أثناء عملية البحث على شبكة الإنترنت قبل الكلمات التي لا تريد أن تشملها نتائج البحث.','The sign ...... is used while searching online before the words you do not want in the results.','(-)~(+)~(/)~(#)',0,3,'a');
T('يجب استخدام ميزات الأمان الموجودة في المتصفح.','You should use the safety features in the browser.',1,1,'a');

let nm='',sc={},ex=false,pg=0,fin=[0,0],aud;
const P=[{k:'L',i:0},{k:'Q',s:1},{k:'L',i:1},{k:'Q',s:2},{k:'L',i:2},{k:'Q',s:3},{k:'L',i:3},{k:'X'}];
const bi=(e,a)=>`<div class=en>${e}</div><div class=ar>${a}</div>`;
const draw=h=>{$('#app').innerHTML=`<div class=wrap><header><img src="${LG}"><div>${bi('Internet Search Processes','عمليات البحث على شبكة الإنترنت')}<small>Grade 4 • Unit 2 • Lesson 3${nm?' | '+nm:''}</small></div></header>${h}</div>`;scrollTo(0,0)};
function beep(ok){try{aud=aud||new AudioContext();const t=aud.currentTime;(ok?[523,659,784,1047]:[220,160]).forEach((f,i)=>{const o=aud.createOscillator(),g=aud.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.25,t+i*.14);g.gain.exponentialRampToValueAtTime(.001,t+i*.14+.3);o.connect(g);g.connect(aud.destination);o.start(t+i*.14);o.stop(t+i*.14+.3)})}catch(e){}}
function fx(ok){beep(ok);const E=ok?['⭐','🎉','✨','🌟']:['❌','😢','💥'];for(let i=0;i<14;i++){const e=document.createElement('div');e.className='fx';e.textContent=E[i%E.length];e.style.left=Math.random()*92+'vw';e.style.top=50+Math.random()*40+'vh';document.body.append(e);setTimeout(()=>e.remove(),1400)}}
function quiz(Q,done){let i=0,s=0;(function show(){const q=Q[i];
draw(`<div class=card><div class=bar><i style="width:${i/Q.length*100}%"></i></div><b>${i+1} / ${Q.length}</b>${bi(q.en,q.ar)}<div>${q.o.map((t,j)=>{const[a,e]=t.split('|');return `<button class=opt onclick="ans(${j})">${e?e+'<br>':''}${a}</button>`}).join('')}</div><div id=fb class=c></div></div>`);
window.ans=j=>{const b=document.querySelectorAll('.opt');b.forEach(x=>x.disabled=true);const ok=j==q.a;b[j].classList.add(ok?'ok':'bad');if(!ok)b[q.a].classList.add('ok');if(ok)s++;fx(ok);$('#fb').innerHTML=`<h2 class=${ok?'g':'r'}>${ok?'🎉 Correct! أحسنت!':'❌ Wrong! إجابة خاطئة'}</h2><button onclick="nx()">${i+1<Q.length?'Next ▶ التالي':'Finish ✔ إنهاء'}</button>`};
window.nx=()=>{++i<Q.length?show():done(s,Q.length)}})()}
const pick=s=>{const l=B.filter(q=>q.s==s),st=l.length/8;return Array.from({length:8},(_,i)=>l[Math.floor(i*st)])};
function go(n){pg=n;const p=P[n];
if(p.k=='L'){const l=L[p.i];draw(`<div class=card><h1>${l.t[0]}<br><span class=ar>${l.t[1]}</span></h1>${l.p.map((x,i)=>`<div class=pt style="animation-delay:${i*.2}s">${bi(x[0],x[1])}</div>`).join('')}<div class=c>${n?`<button onclick="go(${n-1})">◀ Back | رجوع</button>`:''}<button onclick="go(${n+1})">Next ▶ التالي</button></div></div>`)}
else if(p.k=='Q')draw(`<div class="card c"><h1>📝 Quiz ${p.s} | أسئلة الجزء ${p.s}</h1>${bi('8 questions from the book exercises','8 أسئلة من تدريبات الكتاب')}<button class=o2 onclick="runQ(${n})">▶ Start | ابدأ</button></div>`);
else{const c=B.filter(q=>q.f=='e'||ex).length;draw(`<div class="card c"><h1>🏆 Final Exam | الاختبار النهائي</h1>${bi(`All questions of the English file (39)${ex?' + all questions of the Arabic file (38)':''}. Total: ${c}`,`كل أسئلة ملف اللغة الإنجليزية (39)${ex?' + كل أسئلة الملف العربي (38)':''}. المجموع: ${c} سؤالًا`)}<button class=o2 onclick="ex=!ex;go(${n})">${ex?'➖ إزالة أسئلة الملف العربي | Remove Arabic-file questions':'➕ إضافة أسئلة الملف العربي | Add Arabic-file questions'}</button><br><button onclick="runX()">▶ Start Exam | ابدأ الاختبار</button></div>`)}}
function runQ(n){const s=P[n].s;quiz(pick(s),(r,t)=>{sc['الجزء '+s]=r+'/'+t;fx(r>5);draw(`<div class="card c"><h1>⭐ ${r} / ${t}</h1>${bi(r>5?'Great job!':'Keep trying!',r>5?'ممتاز! أحسنت!':'حاول مرة أخرى!')}<button onclick="runQ(${n})">🔁 Retry | إعادة</button><button onclick="go(${n+1})">Next ▶ التالي</button></div>`)})}
function runX(){const Q=B.filter(q=>q.f=='e').concat(ex?B.filter(q=>q.f=='a'):[]);quiz(Q,(r,t)=>{fin=[r,t];fx(1);const p=Math.round(r/t*100);draw(`<div class="card c"><h1>🏆 ${nm}</h1><h1>${r} / ${t} (${p}%)</h1>${bi(p>=50?'Well done!':'Review the lesson and try again!',p>=50?'أحسنت!':'راجع الدرس وحاول مرة أخرى!')}<button class=wa onclick="wa()">📲 Send result to WhatsApp | إرسال النتيجة إلى واتساب</button><br><button onclick="go(7)">🔁 Again | إعادة</button></div>`)})}
function wa(){const m=`منصة محترف - MOHTARF\nنتيجة اختبار الدرس الثالث: عمليات البحث على شبكة الإنترنت (الصف الرابع الابتدائي)\nالاسم: ${nm}\nالنتيجة النهائية: ${fin[0]} / ${fin[1]} (${Math.round(fin[0]/fin[1]*100)}%)\n`+Object.entries(sc).map(([k,v])=>k+': '+v).join('\n');window.open('https://wa.me/201099920517?text='+encodeURIComponent(m),'_blank')}
function start(){const v=$('#nm').value.trim();if(!v){$('#nm').style.borderColor='red';return}nm=v;go(0)}
draw(`<div class="card c"><img src="${LG}" style="height:200px">${bi('Welcome! Enter your name to start','أهلًا بك! اكتب اسمك لتبدأ الدرس')}<input id=nm placeholder="الاسم | Your name"><button onclick="start()">▶ Start | ابدأ</button></div>`);
const bg=$('#bg');['#ffb84d','#3b73c9','#2ecc71','#ff7a7a'].forEach((c,k)=>{for(let i=0;i<4;i++){const s=document.createElement('span'),z=20+Math.random()*60;s.style.cssText=`width:${z}px;height:${z}px;background:${c};left:${Math.random()*95}vw;animation-duration:${10+Math.random()*14}s;animation-delay:-${Math.random()*10}s`;bg.append(s)}});
